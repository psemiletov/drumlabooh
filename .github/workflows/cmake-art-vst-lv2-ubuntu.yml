# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake art VSTi/LV2 on Ubuntu

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag to upload zip artifacts to'
        required: false
        default: ''
        type: string

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
          sudo apt update
          sudo apt install -y git make g++ cmake pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev zip

    - name: Configure CMake
      run: cmake -DINSTALLKITS=OFF -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Archive artifacts VST3
      uses: actions/upload-artifact@v4
      with:
       name: drumlabooh.vst3
       path: ${{github.workspace}}/build/drumlabooh_artefacts/Release/VST3

    - name: Archive artifacts VST3-multi
      uses: actions/upload-artifact@v4
      with:
       name: drumlabooh-multi.vst3
       path: ${{github.workspace}}/build/drumlabooh-multi_artefacts/Release/VST3

    - name: Archive artifacts LV2
      uses: actions/upload-artifact@v4
      with:
       name: drumlabooh.lv2
       path: ${{github.workspace}}/build/drumlabooh_artefacts/Release/LV2

    - name: Archive artifacts LV2-multi
      uses: actions/upload-artifact@v4
      with:
       name: drumlabooh-multi.lv2
       path: ${{github.workspace}}/build/drumlabooh-multi_artefacts/Release/LV2

    - name: Upload zip artifacts to GitHub Release
      if: ${{ inputs.release_tag != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ${{github.workspace}}/release-zips
        (cd ${{github.workspace}}/build/drumlabooh_artefacts/Release/VST3 && zip -rq ${{github.workspace}}/release-zips/drumlabooh.vst3.zip .)
        (cd ${{github.workspace}}/build/drumlabooh-multi_artefacts/Release/VST3 && zip -rq ${{github.workspace}}/release-zips/drumlabooh-multi.vst3.zip .)
        (cd ${{github.workspace}}/build/drumlabooh_artefacts/Release/LV2 && zip -rq ${{github.workspace}}/release-zips/drumlabooh.lv2.zip .)
        (cd ${{github.workspace}}/build/drumlabooh-multi_artefacts/Release/LV2 && zip -rq ${{github.workspace}}/release-zips/drumlabooh-multi.lv2.zip .)
        gh release upload "${{ inputs.release_tag }}" ${{github.workspace}}/release-zips/*.zip --clobber
